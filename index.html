
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon accès Facebook</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .carte {
      background: white;
      width: 90%;
      max-width: 380px;
      padding: 30px 22px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 20px #00000015;
    }

    .logo {
      color: #1877f2;
      font-size: 70px;
      font-weight: bold;
    }

    h1 {
      color: #1877f2;
      font-size: 26px;
    }

    p {
      color: #606770;
      line-height: 1.5;
    }

    .bouton {
      display: block;
      margin-top: 24px;
      padding: 15px;
      background: #1877f2;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      border-radius: 9px;
    }

    .bouton:active {
      background: #0d65d9;
    }

    footer {
      margin-top: 22px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>
  <main class="carte">
    <div class="logo">f</div>

    <h1>Bienvenue</h1>

    <p>
      Accède à Facebook rapidement
      grâce à notre site.
    </p>

    <a
      class="bouton"
      href="https://www.facebook.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Ouvrir Facebook
    </a>

    <footer>
      Accès direct au site officiel de Facebook.
    </footer>
  </main>
</body>
</html>
